name: Build Flutter Desktop Applications

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Single-File SFX Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows Desktop Release
        shell: powershell
        run: |
          cd apps/desktop
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release

      - name: Download 7-Zip Extra SFX Module
        shell: powershell
        run: |
          $url = "https://www.7-zip.org/a/7z2409_extra.7z"
          $output = "$env:TEMP\7z_extra.7z"
          Invoke-WebRequest -Uri $url -OutFile $output
          & "7z.exe" x $output "7zSD.sfx" -o"$env:TEMP\sfx" -r

      - name: Embed Administrator Execution Level in SFX Stub
        shell: powershell
        run: |
          $manifest = @"
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <trustInfo xmlns="urn:schemas-microsoft-com:asm.v3">
              <security>
                <requestedPrivileges>
                  <requestedExecutionLevel level="requireAdministrator" uiAccess="false"/>
                </requestedPrivileges>
              </security>
            </trustInfo>
          </assembly>
          "@
          Set-Content -Path "$env:TEMP\sfx\sfx.manifest" -Value $manifest -Encoding UTF8
          & mt.exe -manifest "$env:TEMP\sfx\sfx.manifest" -outputresource:"$env:TEMP\sfx\7zSD.sfx;#1"

      - name: Compress Release Bundle to 7z Archive
        shell: powershell
        run: |
          $releaseDir = "apps/desktop/build/windows/x64/runner/Release"
          if (-not (Test-Path $releaseDir)) {
            $releaseDir = "apps/desktop/build/windows/runner/Release"
          }
          & "7z.exe" a -mx9 -r "$env:TEMP\app.7z" "$releaseDir\*"

      - name: Assemble Self-Extracting Windows Executable
        shell: powershell
        run: |
          $config = @'
          ;!@Install@!UTF-8!
          Title="Packet Tracer Exam Client"
          InstallPath="%PROGRAMFILES%\\PacketTracerExamClient"
          OverwriteMode="1"
          RunProgram="desktop.exe"
          ;!@InstallEnd@!
          '@
          [System.IO.File]::WriteAllText("$env:TEMP\config.txt", $config, [System.Text.Encoding]::UTF8)

          $outputFile = "$PWD\PacketTracerExamClient-Windows-Setup.exe"
          $inputFiles = @("$env:TEMP\sfx\7zSD.sfx", "$env:TEMP\config.txt", "$env:TEMP\app.7z")
          $outStream = [System.IO.File]::Create($outputFile)
          try {
            foreach ($file in $inputFiles) {
              $inputStream = [System.IO.File]::OpenRead($file)
              try {
                $inputStream.CopyTo($outStream)
              }
              finally {
                $inputStream.Dispose()
              }
            }
          }
          finally {
            $outStream.Dispose()
          }

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketTracerExamClient-Windows
          path: PacketTracerExamClient-Windows-Setup.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev wget file

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Linux Desktop Release
        run: |
          cd apps/desktop
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release

      - name: Prepare AppDir Structure
        run: |
          BUNDLE_DIR="apps/desktop/build/linux/x64/release/bundle"
          if [ ! -d "$BUNDLE_DIR" ]; then
            BUNDLE_DIR="apps/desktop/build/linux/release/bundle"
          fi

          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp -r "$BUNDLE_DIR"/* AppDir/
          cp apps/desktop/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png AppDir/desktop.png
          cp apps/desktop/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png AppDir/usr/share/icons/hicolor/256x256/apps/desktop.png

          cat << 'EOF' > AppDir/desktop.desktop
          [Desktop Entry]
          Type=Application
          Name=Packet Tracer Exam Client
          Comment=Aplikasi Ujian Cisco Packet Tracer
          Exec=desktop
          Icon=desktop
          Categories=Education;Utility;
          Terminal=false
          EOF

          cp AppDir/desktop.desktop AppDir/usr/share/applications/desktop.desktop

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export LD_LIBRARY_PATH="${HERE}/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/desktop" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Package AppImage via AppImageTool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun --no-appstream AppDir PacketTracerExamClient-Linux-x86_64.AppImage

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketTracerExamClient-Linux
          path: PacketTracerExamClient-Linux-x86_64.AppImage
          if-no-files-found: error

  build-macos:
    name: Build macOS DMG Package
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build macOS Desktop Release
        run: |
          cd apps/desktop
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release

      - name: Assemble DMG Installer
        run: |
          mkdir -p dmg_staging
          cp -R apps/desktop/build/macos/Build/Products/Release/desktop.app "dmg_staging/Packet Tracer Exam Client.app"
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "Packet Tracer Exam Client" -srcfolder dmg_staging -ov -format UDZO "PacketTracerExamClient-macOS.dmg"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketTracerExamClient-macOS
          path: PacketTracerExamClient-macOS.dmg
          if-no-files-found: error

  publish-github-release:
    name: Publish Release Packages
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: PacketTracerExamClient-Windows

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: PacketTracerExamClient-Linux

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: PacketTracerExamClient-macOS

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PacketTracerExamClient-Windows-Setup.exe
            PacketTracerExamClient-Linux-x86_64.AppImage
            PacketTracerExamClient-macOS.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
